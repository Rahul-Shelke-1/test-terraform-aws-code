name: Smart Terraform Module CI

on:
  push:
    branches:
      - main
      - test/terraform
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-ci.yml'

env:
  AWS_REGION: "ap-south-1"

permissions:
  id-token: write
  contents: read

jobs:
  # Job 1: Detect which modules have changes
  detect-changes:
    name: Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # This action checks which folders inside 'modules/' were modified
      - name: Check file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # Define your list of modules here as filters dynamically or explicitly
          # Example assumes you have folders like modules/s3-bucket, modules/vpc, etc.
          filters: |
            terraform/modules/s3_bucket:
              - 'terraform/modules/s3_bucket/**'

  # Job 2: Run tests ONLY for the modules identified as changed
  test-modules:
    name: Test Module (${{ matrix.module }})
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.modules != '[]' && needs.detect-changes.outputs.modules != '' }}

    # Only run this job if changes were detected, and create a matrix of those changed modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_Module_CI
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/requirements*.txt"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv pip install --system pytest tftest

      - name: OpenTofu Format Check
        run: tofu fmt -check

      - name: OpenTofu Init
        run: tofu init -backend=false

      - name: OpenTofu Validate
        run: tofu validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      # Run Unit Tests inside the changed module's directory
      - name: Run Unit Tests (pytest)
        if: hashFiles(format('{0}/tests/unit/**', matrix.module)) != ''
        run: pytest tests/unit

      # Run Integration Tests inside the changed module's directory
      - name: Run Integration Tests (tftest)
        if: hashFiles(format('{0}/tests/integration/**', matrix.module)) != ''
        run: pytest tests/integration
